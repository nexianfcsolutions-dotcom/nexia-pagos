# Cloudflare Workers: servicio de pagos de NEXIA (ver worker/index.mjs).
name = "nexia-pagos"
main = "worker/index.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Dirección pública: https://nexia-pagos.nexianfcsolutions.workers.dev (la usan la web y el webhook de Stripe)
workers_dev = true
preview_urls = false

# Registros de cada petición (Cloudflare > nexia-pagos > Observability), para revisar pedidos y errores
[observability]
enabled = true

# Página de prueba interna (public/prueba-pago); las rutas /api/* las atiende el worker.
[assets]
directory = "public"

# Almacén de pedidos (Cloudflare > Storage & databases > Workers KV > nexia-pedidos)
[[kv_namespaces]]
binding = "PEDIDOS"
id = "f912ac4702bb4613b7a3720c7e984864"
